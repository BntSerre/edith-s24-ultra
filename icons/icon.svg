<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#072b4a" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#031120" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020912" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#ff3c00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>

  <!-- Tactical HUD Grid overlay -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,8"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.3" filter="url(#glow)"/>
  
  <!-- Outer Cyan Segmented Ring (JARVIS) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="14,10" filter="url(#glow)"/>

  <!-- Mid Orange Energy Ring (VISION) -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ff7b00" stroke-width="5" stroke-dasharray="40,15,8,15" stroke-opacity="0.95" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#ff9e00" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Inner Cyan Ring -->
  <circle cx="256" cy="256" r="75" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"/>

  <!-- Central Arc Reactor Core (Amber & Cyan) -->
  <circle cx="256" cy="256" r="50" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="24" fill="#ffffff" filter="url(#glow)"/>

  <!-- Tactical Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="90" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="422" x2="256" y2="472" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="256" x2="90" y2="256" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="422" y1="256" x2="472" y2="256" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>

  <!-- Tactical Corner Brackets -->
  <path d="M 60 100 L 60 60 L 100 60" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 452 100 L 452 60 L 412 60" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 60 412 L 60 452 L 100 452" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 452 412 L 452 452 L 412 452" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>

  <!-- E.D.I.T.H. Text -->
  <text x="256" y="380" text-anchor="middle" font-family="'Orbitron', 'Rajdhani', monospace, sans-serif" font-size="28" font-weight="900" fill="#00e5ff" letter-spacing="8" filter="url(#glow)">E.D.I.T.H.</text>
</svg>
